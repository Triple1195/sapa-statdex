<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Analytics Hub - Pokémon Draft League</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --accent-blue: #1a73e8;
            --text-main: #202124;
            --text-muted: #5f6368;
            --border-color: #dadce0;
            --grid-line: #e0e0e0;
            --sheets-header-bg: #f1f3f4;
            --sheets-border: #c0c0c0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 100px 24px;
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px rgba(60,64,67,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #188038;
        }

        .nav-back {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1600px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .filter-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        select, input {
            background-color: #fff;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem 0.8rem;
            font-size: 0.95rem;
        }

        .tabs-container {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 4px 4px 0 0;
        }

        .tab-button {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            color: #188038;
            border-bottom-color: #188038;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Spreadsheet-Style Grid with Row/Column Header Wrappers */
        .sheet-frame {
            background-color: #ffffff;
            border: 1px solid var(--sheets-border);
            margin-bottom: 2rem;
            border-radius: 4px;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3);
            overflow: hidden;
        }

        .sheets-col-header-row {
            display: flex;
            background-color: var(--sheets-header-bg);
            border-bottom: 1px solid var(--sheets-border);
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 11px;
            color: #5f6368;
            font-weight: bold;
            text-align: center;
        }

        .sheets-corner-cell {
            width: 40px;
            min-width: 40px;
            border-right: 1px solid var(--sheets-border);
            background-color: #eaeeef;
        }

        .sheets-col-letter {
            flex: 1;
            padding: 4px 0;
            border-right: 1px solid var(--sheets-border);
        }

        .sheets-body-row {
            display: flex;
        }

        .sheets-row-headers {
            width: 40px;
            min-width: 40px;
            background-color: var(--sheets-header-bg);
            border-right: 1px solid var(--sheets-border);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 11px;
            color: #5f6368;
            font-weight: bold;
            text-align: center;
        }

        .sheets-row-num {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--sheets-border);
        }

        .sheet-match-container {
            flex: 1;
            background-color: #f1f3f4;
            padding: 14px;
            color: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 12.5px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .sheet-match-inner {
            min-width: 1350px;
        }

        .match-top-banner {
            background: #fff;
            border: 1px solid #bdc1c6;
            padding: 10px 16px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }

        .sheet-scoreboard {
            display: grid;
            grid-template-columns: 620px 1fr 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
            align-items: stretch;
        }

        .score-header {
            display: flex;
            align-items: stretch;
            background: #fff;
            border: 1px solid #bdc1c6;
            overflow: hidden;
            height: 65px;
        }

        .player-banner-winner { 
            background-color: #1a73e8; 
            color: white; 
            padding: 10px 14px; 
            flex: 1; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold;
            font-size: 13px;
        }
        
        .player-banner-loser { 
            background-color: #d93025; 
            color: white; 
            padding: 10px 14px; 
            flex: 1; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold;
            font-size: 13px;
        }

        .vs-divider { 
            font-size: 15px; 
            color: #000; 
            background: #f1f3f4; 
            padding: 0 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold;
            border-left: 1px solid #bdc1c6;
            border-right: 1px solid #bdc1c6;
        }

        .game-column-header {
            background: #fff;
            border: 1px solid #bdc1c6;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 65px;
        }
        .game-summary-header { font-weight: bold; background: #f1f3f4; border-bottom: 1px solid #bdc1c6; padding: 4px; font-size: 12px; }
        .game-summary-winner { font-weight: bold; font-size: 12px; padding: 3px; }

        /* Fixed height for Roster & Game Player Blocks */
        .player-roster-card {
            background: #fff;
            border: 1px solid #bdc1c6;
            height: 318px;
            display: flex;
            flex-direction: column;
        }

        .roster-header {
            background: #202124;
            color: #fff;
            padding: 6px 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .roster-mon-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            border-top: 1px solid #bdc1c6;
            flex: 1;
        }

        .mon-summary-tile {
            border-right: 1px solid #bdc1c6;
            padding: 4px;
            text-align: center;
            font-size: 11px;
            background: #fff;
        }
        .mon-summary-tile:last-child { border-right: none; }
        .mon-sprite { width: 48px; height: 48px; object-fit: contain; }
        .mon-name { font-weight: bold; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mon-nickname { font-size: 10px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        
        .stat-section-title { background: #f1f3f4; font-weight: bold; border-top: 1px solid #bdc1c6; border-bottom: 1px solid #bdc1c6; padding: 2px 3px; font-size: 11px; text-align: center; }
        .stat-row { display: flex; justify-content: space-between; border-top: 1px dashed #e8eaed; padding: 2px 3px; font-size: 11px; }

        .game-player-block {
            background: #fff;
            border: 1px solid #bdc1c6;
            height: 318px;
            display: flex;
            flex-direction: column;
        }

        .game-player-header {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            font-weight: bold;
            border-bottom: 1px solid #bdc1c6;
            font-size: 12px;
        }
        .status-winner { background-color: #1a73e8; color: white; }
        .status-loser { background-color: #d93025; color: white; }

        /* Strict 2x3 Grid: 2 columns, 3 equal rows spanning the available block height */
        .game-mon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0;
            background: #bdc1c6;
            padding: 0;
            flex: 1;
        }

        /* Game Mon Cell Structure */
        .game-mon-cell {
            background: #fff;
            border: 1px solid #bdc1c6;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1.2fr;
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            font-size: 11px;
        }

        .cell-top-left {
            grid-row: 1 / span 2;
            grid-column: 1 / 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2px;
            border-right: 1px solid #bdc1c6;
            border-bottom: 1px solid #bdc1c6;
            box-sizing: border-box;
        }
        .cell-top-left.bg-faint { background-color: #fce8e6; }
        .cell-top-left.bg-survived { background-color: #ffffff; }

        .cell-sprite { width: 26px; height: 26px; object-fit: contain; }

        .status-badge-sheets {
            width: 100%;
            text-align: center;
            font-size: 8px;
            font-weight: bold;
            padding: 1px 0;
            border-top: 1px solid #bdc1c6;
        }
        .status-badge-sheets.faint { background-color: #d93025; color: #ffffff; }
        .status-badge-sheets.survived { background-color: #ffffff; color: #202124; }

        .cell-row-kos {
            grid-row: 1 / 2;
            grid-column: 2 / 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
            border-bottom: 1px solid #bdc1c6;
            font-weight: bold;
            background: #fff;
        }

        .cell-row-turns {
            grid-row: 2 / 3;
            grid-column: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.15;
            padding: 0 4px;
            border-bottom: 1px solid #bdc1c6;
            background: #fff;
            font-size: 10px;
            text-align: center;
        }

        /* Bottom Row: Spanning both columns, perfectly centered horizontally and vertically */
        .cell-row-cause {
            grid-row: 3 / 4;
            grid-column: 1 / 3;
            padding: 2px 4px;
            font-size: 9px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            word-break: break-word;
            overflow: hidden;
            background: #fff;
        }

        .playerdex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.2rem;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .player-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
            margin-bottom: 1rem;
        }

        .pokemon-tile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }

        .pokemon-tile {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .status-msg {
            color: var(--text-muted);
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem;
        }

        @media (max-width: 1024px) {
            .sheet-match-inner {
                min-width: 1350px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Seasonal Analytics Hub</h1>
        <a href="index.html" class="nav-back">&larr; Back to Main Hub</a>
    </header>

    <div class="container">
        <div class="filter-bar">
            <div class="filter-group">
                <label for="seasonSelect">Select Season:</label>
                <select id="seasonSelect" onchange="loadSeasonalData()">
                    <option value="">Loading seasons...</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="weekSelect">Filter Week:</label>
                <select id="weekSelect" onchange="renderMatchesSheetUI()">
                    <option value="all">All Weeks</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="playerSearch">Search Player:</label>
                <input type="text" id="playerSearch" placeholder="Type player name..." onkeyup="renderMatchesSheetUI(); renderPlayerdex();">
            </div>
        </div>

        <div class="tabs-container">
            <button class="tab-button active" onclick="switchTab('statdex')">Seasonal Statdex (Matches)</button>
            <button class="tab-button" onclick="switchTab('playerdex')">Seasonal Playerdex (Rosters & Stats)</button>
            <button class="tab-button" onclick="switchTab('draftboard')">Draft Board & Budgets</button>
        </div>

        <div id="statdex" class="tab-content active">
            <div id="matchGrid">
                <div class="status-msg">Loading seasonal data...</div>
            </div>
        </div>

        <div id="playerdex" class="tab-content">
            <div id="playerdexGrid" class="playerdex-grid">
                <div class="status-msg">Loading player cards...</div>
            </div>
        </div>

        <div id="draftboard" class="tab-content">
            <div id="draftBoardContent" class="status-msg">Draft board data will render here.</div>
        </div>
    </div>

    <!-- Load external configuration and shared helpers -->
    <script src="config.js"></script>
    <script src="helper.js"></script>

    <script>
        let rawMatches = [];
        let rawStats = [];
        
        window.playerAliasesMap = {}; 
        window.displayToTagMap = {};   

        window.addEventListener('DOMContentLoaded', () => { initApp(); });

        async function tursoQuery(statements) {
            if (typeof TURSO_DB_URL === 'undefined' || typeof TURSO_READONLY_TOKEN === 'undefined' || TURSO_READONLY_TOKEN.includes("YOUR_READ_ONLY_TOKEN")) {
                document.getElementById('matchGrid').innerHTML = '<div class="status-msg" style="color:#d93025;">Please configure your Turso read-only credentials in config.js.</div>';
                return null;
            }

            const httpUrl = TURSO_DB_URL.replace('libsql://', 'https://');
            const response = await fetch(`${httpUrl}/v2/pipeline`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${TURSO_READONLY_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    requests: statements.map(s => ({
                        type: 'execute',
                        stmt: { 
                            sql: s.sql, 
                            args: s.args ? s.args.map(arg => ({ type: typeof arg === 'number' ? 'integer' : 'text', value: String(arg) })) : [] 
                        }
                    }))
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Database query failed');
            
            return data.results.map(res => {
                if (res.type === 'error') throw new Error(res.error.message);
                const cols = res.response.result.cols.map(c => c.name);
                return res.response.result.rows.map(row => {
                    let obj = {};
                    cols.forEach((col, idx) => { obj[col] = row[idx].value; });
                    return obj;
                });
            });
        }

        async function initApp() {
            try {
                const aliasResult = await tursoQuery([{ sql: "SELECT display_name, showdown_tag FROM player_aliases" }]);
                if (aliasResult && aliasResult[0]) {
                    aliasResult[0].forEach(row => {
                        const disp = (row.display_name || '').trim();
                        const tag = (row.showdown_tag || '').trim();
                        if (disp && tag) {
                            window.playerAliasesMap[tag.toLowerCase()] = disp;
                            window.displayToTagMap[disp.toLowerCase()] = tag;
                        }
                    });
                }

                const results = await tursoQuery([{ sql: "SELECT season FROM seasons ORDER BY season DESC" }]);
                if (!results) return;

                const seasons = results[0];
                const seasonSelect = document.getElementById('seasonSelect');
                seasonSelect.innerHTML = '';

                if (!seasons || seasons.length === 0) {
                    seasonSelect.innerHTML = '<option value="">No seasons found</option>';
                    return;
                }

                seasons.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season;
                    opt.innerText = `Season ${s.season}`;
                    seasonSelect.appendChild(opt);
                });

                loadSeasonalData();
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        async function loadSeasonalData() {
            const season = document.getElementById('seasonSelect').value;
            if (!season) return;

            try {
                const results = await tursoQuery([
                    {
                        sql: `SELECT m.match_id, m.conference, m.week, m.player_1, m.player_2, 
                                     g.game_number, g.game_id, g.replay_url, g.winner, g.turns 
                              FROM matches m 
                              LEFT JOIN match_games g ON m.match_id = g.match_id 
                              WHERE m.season = ? 
                              ORDER BY m.week ASC, m.conference ASC, m.match_id ASC, g.game_number ASC`,
                        args: [season]
                    },
                    {
                        sql: `SELECT s.stat_id, s.game_id, s.player, s.pokemon, s.nickname, s.faint_type, s.faint_source, s.faint_move,
                                     s.direct_kos, s.indirect_kos, s.self_kos, s.total_damage, s.direct_damage, s.indirect_damage,
                                     s.hazard_damage, s.hits_taken, s.damage_taken, s.damage_healed, s.active_turns, s.survived, s.fainted, s.battle_won
                              FROM match_pokemon_stats s
                              JOIN match_games g ON s.game_id = g.game_id
                              JOIN matches m ON g.match_id = m.match_id
                              WHERE m.season = ?`,
                        args: [season]
                    }
                ]);

                if (!results) return;

                rawMatches = results[0];
                rawStats = results[1];

                const weeks = [...new Set(rawMatches.map(m => m.week))].sort((a, b) => a - b);
                const weekSelect = document.getElementById('weekSelect');
                weekSelect.innerHTML = '<option value="all">All Weeks</option>';
                weeks.forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w;
                    opt.innerText = `Week ${w}`;
                    weekSelect.appendChild(opt);
                });

                renderMatchesSheetUI();
                renderPlayerdex();
            } catch (err) {
                console.error("Error loading seasonal data:", err);
            }
        }

        function renderMatchesSheetUI() {
            const weekFilter = document.getElementById('weekSelect').value;
            const playerFilter = document.getElementById('playerSearch').value.toLowerCase();
            const grid = document.getElementById('matchGrid');

            const matchGroups = {};
            
            const sortedMatches = [...rawMatches].sort((a, b) => {
                if (Number(a.week) !== Number(b.week)) return Number(a.week) - Number(b.week);
                if (String(a.conference) !== String(b.conference)) return String(a.conference).localeCompare(String(b.conference));
                return Number(a.match_id) - Number(b.match_id);
            });

            sortedMatches.forEach(m => {
                const matchWeek = String(m.week);
                const p1Display = getDisplayName(m.player_1);
                const p2Display = getDisplayName(m.player_2);

                const matchesWeek = (weekFilter === 'all' || matchWeek === weekFilter);
                const matchesPlayer = (!playerFilter || p1Display.toLowerCase().includes(playerFilter) || p2Display.toLowerCase().includes(playerFilter));

                if (matchesWeek && matchesPlayer) {
                    if (!matchGroups[m.match_id]) {
                        matchGroups[m.match_id] = { info: m, games: [] };
                    }
                    if (m.game_number) {
                        matchGroups[m.match_id].games.push(m);
                    }
                }
            });

            const matchIds = Object.keys(matchGroups);
            if (matchIds.length === 0) {
                grid.innerHTML = '<div class="status-msg">No matches found matching filters.</div>';
                return;
            }

            grid.innerHTML = matchIds.map(matchId => {
                const match = matchGroups[matchId];
                const info = match.info;
                const games = match.games;

                const p1Display = getDisplayName(info.player_1);
                const p2Display = getDisplayName(info.player_2);

                let p1Wins = 0;
                let p2Wins = 0;
                games.forEach(g => {
                    const gWinnerDisp = getDisplayName(g.winner);
                    if (gWinnerDisp.toLowerCase() === p1Display.toLowerCase()) p1Wins++;
                    if (gWinnerDisp.toLowerCase() === p2Display.toLowerCase()) p2Wins++;
                });

                const p1IsSetWinner = p1Wins > p2Wins;
                const p2IsSetWinner = p2Wins > p1Wins;

                const p1HazardTotal = calculateTotalHazardDamage(info.player_1, games);
                const p2HazardTotal = calculateTotalHazardDamage(info.player_2, games);

                const gameHeadersHTML = [1, 2, 3].map(gNum => {
                    const gameData = games.find(g => Number(g.game_number) === gNum);
                    if (!gameData) {
                        return `
                            <div class="game-column-header">
                                <div class="game-summary-header">Game ${gNum}</div>
                                <div class="game-summary-winner" style="color:#5f6368; font-size:12px;">N/A</div>
                            </div>
                        `;
                    }
                    const winnerDisplay = getDisplayName(gameData.winner);
                    return `
                        <div class="game-column-header">
                            <div class="game-summary-header">Game ${gNum}: ${gameData.turns || 0} Turns</div>
                            <div class="game-summary-winner">${winnerDisplay ? `Winner: ${winnerDisplay}` : 'Pending'}</div>
                            ${gameData.replay_url ? `<a href="${gameData.replay_url}" target="_blank" style="font-size:11px; margin-bottom:3px;">Replay Link</a>` : ''}
                        </div>
                    `;
                }).join('');

                const p1GameBlocksHTML = [1, 2, 3].map(gNum => {
                    const gameData = games.find(g => Number(g.game_number) === gNum);
                    if (!gameData) {
                        return `<div class="game-player-block" style="display:flex; align-items:center; justify-content:center; color:#5f6368; font-size:12px;">Game Not Played</div>`;
                    }
                    const winnerDisplay = getDisplayName(gameData.winner);
                    const p1GameHazards = calculateGameHazardDamage(gameData.game_id, info.player_1);
                    const isP1Winner = winnerDisplay.toLowerCase() === p1Display.toLowerCase();

                    return `
                        <div class="game-player-block">
                            <div class="game-player-header ${isP1Winner ? 'status-winner' : 'status-loser'}">
                                <span>${p1Display}</span>
                                <span>${p1GameHazards} Dmg</span>
                            </div>
                            <div class="game-mon-grid">${renderGameMonCells(gameData.game_id, info.player_1)}</div>
                        </div>
                    `;
                }).join('');

                const p2GameBlocksHTML = [1, 2, 3].map(gNum => {
                    const gameData = games.find(g => Number(g.game_number) === gNum);
                    if (!gameData) {
                        return `<div class="game-player-block" style="display:flex; align-items:center; justify-content:center; color:#5f6368; font-size:12px;">Game Not Played</div>`;
                    }
                    const winnerDisplay = getDisplayName(gameData.winner);
                    const p2GameHazards = calculateGameHazardDamage(gameData.game_id, info.player_2);
                    const isP2Winner = winnerDisplay.toLowerCase() === p2Display.toLowerCase();

                    return `
                        <div class="game-player-block">
                            <div class="game-player-header ${isP2Winner ? 'status-winner' : 'status-loser'}">
                                <span>${p2Display}</span>
                                <span>${p2GameHazards} Dmg</span>
                            </div>
                            <div class="game-mon-grid">${renderGameMonCells(gameData.game_id, info.player_2)}</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="sheet-frame">
                        <div class="sheets-col-header-row">
                            <div class="sheets-corner-cell"></div>
                            <div class="sheets-col-letter">A</div>
                            <div class="sheets-col-letter">B</div>
                            <div class="sheets-col-letter">C</div>
                            <div class="sheets-col-letter">D</div>
                        </div>
                        <div class="sheets-body-row">
                            <div class="sheets-row-headers">
                                <div class="sheets-row-num">1</div>
                                <div class="sheets-row-num">2</div>
                                <div class="sheets-row-num">3</div>
                            </div>
                            <div class="sheet-match-container">
                                <div class="sheet-match-inner">
                                    <div class="match-top-banner">
                                        Week ${info.week} &mdash; ${info.conference ? 'Conference ' + info.conference : 'Main Conference'}
                                    </div>

                                    <!-- Row 1: Score Header (Col 1) + Game Headers (Cols 2-4) -->
                                    <div class="sheet-scoreboard">
                                        <div class="score-header">
                                            <div class="${p1IsSetWinner ? 'player-banner-winner' : 'player-banner-loser'}"><span>${p1Display}</span> <span>${p1Wins}</span></div>
                                            <span class="vs-divider">VS</span>
                                            <div class="${p2IsSetWinner ? 'player-banner-winner' : 'player-banner-loser'}"><span>${p2Wins}</span> <span>${p2Display}</span></div>
                                        </div>
                                        ${gameHeadersHTML}
                                    </div>

                                    <!-- Row 2: Player 1 Roster Card (Col 1) + Player 1 Game Blocks (Cols 2-4) -->
                                    <div class="sheet-scoreboard" style="margin-bottom: 14px;">
                                        <div class="player-roster-card" style="margin-bottom: 0;">
                                            <div class="roster-header"><span>Player: ${p1Display}</span> <span>${p1HazardTotal} Hazard Damage</span></div>
                                            <div class="roster-mon-grid">${renderPlayerMonSummaries(info.player_1, games)}</div>
                                        </div>
                                        ${p1GameBlocksHTML}
                                    </div>

                                    <!-- Row 3: Player 2 Roster Card (Col 1) + Player 2 Game Blocks (Cols 2-4) -->
                                    <div class="sheet-scoreboard" style="margin-bottom: 0;">
                                        <div class="player-roster-card" style="margin-bottom: 0;">
                                            <div class="roster-header"><span>Player: ${p2Display}</span> <span>${p2HazardTotal} Hazard Damage</span></div>
                                            <div class="roster-mon-grid">${renderPlayerMonSummaries(info.player_2, games)}</div>
                                        </div>
                                        ${p2GameBlocksHTML}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateTotalHazardDamage(rawPlayerName, games) {
            const gameIds = games.map(g => String(g.game_id));
            const showdownTag = getShowdownTag(rawPlayerName).toLowerCase();
            const displayName = getDisplayName(rawPlayerName).toLowerCase();
            
            const playerStats = rawStats.filter(s => {
                const statPlayer = (s.player || '').trim().toLowerCase();
                return (statPlayer === showdownTag || statPlayer === displayName || getDisplayName(s.player).toLowerCase() === displayName) && gameIds.includes(String(s.game_id));
            });

            let total = 0;
            playerStats.forEach(s => {
                total += Number(s.hazard_damage || 0);
            });
            return total;
        }

        function renderPlayerMonSummaries(rawPlayerName, games) {
            const gameIds = games.map(g => String(g.game_id));
            const showdownTag = getShowdownTag(rawPlayerName).toLowerCase();
            const displayName = getDisplayName(rawPlayerName).toLowerCase();
            
            const playerStats = rawStats.filter(s => {
                const statPlayer = (s.player || '').trim().toLowerCase();
                return (statPlayer === showdownTag || statPlayer === displayName || getDisplayName(s.player).toLowerCase() === displayName) && gameIds.includes(String(s.game_id));
            });
            
            const aggregated = {};
            playerStats.forEach(s => {
                if (!aggregated[s.pokemon]) {
                    aggregated[s.pokemon] = { 
                        species: s.pokemon, 
                        nickname: s.nickname || s.pokemon,
                        directKos: 0, 
                        indirectKos: 0, 
                        teamKos: 0,
                        totalDmg: 0,
                        takenDmg: 0,
                        healedDmg: 0
                    };
                }
                aggregated[s.pokemon].directKos += Number(s.direct_kos || 0);
                aggregated[s.pokemon].indirectKos += Number(s.indirect_kos || 0);
                aggregated[s.pokemon].teamKos += Number(s.self_kos || 0);
                aggregated[s.pokemon].totalDmg += Number(s.total_damage || 0);
                aggregated[s.pokemon].takenDmg += Number(s.damage_taken || 0);
                aggregated[s.pokemon].healedDmg += Number(s.damage_healed || 0);
            });

            const mons = Object.values(aggregated).slice(0, 6);
            if (mons.length === 0) {
                return '<div style="padding:10px; grid-column:span 6; text-align:center; background:#fff;">No Pokémon data logged</div>';
            }

            return mons.map(m => {
                const spriteUrl = getSpriteUrl(m.species, 'gen5');

                return `
                    <div class="mon-summary-tile">
                        <img src="${spriteUrl}" class="mon-sprite" onerror="handleImageError(this)" />
                        <div class="mon-name">${m.species}</div>
                        <div class="mon-nickname">${m.nickname}</div>
                        <div class="stat-section-title">Knock Outs</div>
                        <div class="stat-row"><span>Direct:</span> <strong>${m.directKos}</strong></div>
                        <div class="stat-row"><span>Indirect:</span> <strong>${m.indirectKos}</strong></div>
                        <div class="stat-row"><span>Team:</span> <strong>${m.teamKos}</strong></div>
                        <div class="stat-section-title">Stats</div>
                        <div class="stat-row"><span>Dealt:</span> <strong>${m.totalDmg}%</strong></div>
                        <div class="stat-row"><span>Taken:</span> <strong>${m.takenDmg}%</strong></div>
                        <div class="stat-row"><span>Healed:</span> <strong>${m.healedDmg}%</strong></div>
                    </div>
                `;
            }).join('');
        }

        function calculateGameHazardDamage(gameId, rawPlayerName) {
            const showdownTag = getShowdownTag(rawPlayerName).toLowerCase();
            const displayName = getDisplayName(rawPlayerName).toLowerCase();

            const gameStats = rawStats.filter(s => {
                const statPlayer = (s.player || '').trim().toLowerCase();
                return (statPlayer === showdownTag || statPlayer === displayName || getDisplayName(s.player).toLowerCase() === displayName) && String(s.game_id) === String(gameId);
            });

            let total = 0;
            gameStats.forEach(s => {
                total += Number(s.hazard_damage || 0);
            });
            return total;
        }

        function renderGameMonCells(gameId, rawPlayerName) {
            const showdownTag = getShowdownTag(rawPlayerName).toLowerCase();
            const displayName = getDisplayName(rawPlayerName).toLowerCase();

            const gameStats = rawStats.filter(s => {
                const statPlayer = (s.player || '').trim().toLowerCase();
                return (statPlayer === showdownTag || statPlayer === displayName || getDisplayName(s.player).toLowerCase() === displayName) && String(s.game_id) === String(gameId);
            });
            const mons = gameStats.slice(0, 6);

            if (mons.length === 0) {
                return '<div style="padding:10px; grid-column:span 2; background:#fff; text-align:center;">No log stats</div>';
            }

            return mons.map(m => {
                const isFainted = Number(m.survived) === 0;
                const spriteType = isFainted ? 'monotone' : 'color';
                const spriteUrl = getSpriteUrl(m.pokemon, spriteType);

                const totalKos = Number(m.direct_kos || 0) + Number(m.indirect_kos || 0) + Number(m.self_kos || 0);
                
                let line1 = '';
                let line2 = '';
                if (isFainted) {
                    const source = (m.faint_source && m.faint_source !== "N/A" && m.faint_source !== "Unknown") ? m.faint_source : '';
                    const move = (m.faint_move && m.faint_move !== "Unknown") ? m.faint_move : '';
                    line1 = source;
                    line2 = move;
                }

                return `
                    <div class="game-mon-cell">
                        <div class="cell-top-left ${isFainted ? 'bg-faint' : 'bg-survived'}">
                            <img src="${spriteUrl}" class="cell-sprite" onerror="handleImageError(this)" />
                            <div class="status-badge-sheets ${isFainted ? 'faint' : 'survived'}">
                                ${isFainted ? 'Fainted' : 'Survived'}
                            </div>
                        </div>

                        <div class="cell-row-kos">
                            <span>KOs:</span>
                            <span>${totalKos}</span>
                        </div>
                        <div class="cell-row-turns">
                            <strong>Active</strong> ${m.active_turns || 0} Turns
                        </div>
                        <div class="cell-row-cause">
                            ${isFainted ? `<div><strong>${line1}</strong></div><div>${line2}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPlayerdex() {
            const playerFilter = document.getElementById('playerSearch').value.toLowerCase();
            const grid = document.getElementById('playerdexGrid');

            const playerMap = {};
            rawStats.forEach(st => {
                const dispName = getDisplayName(st.player);
                if (!playerMap[dispName]) {
                    playerMap[dispName] = { pokemon: {} };
                }
                if (!playerMap[dispName].pokemon[st.pokemon]) {
                    playerMap[dispName].pokemon[st.pokemon] = { kos: 0, wins: 0, battles: 0 };
                }
                playerMap[dispName].pokemon[st.pokemon].kos += Number(st.direct_kos || 0);
                playerMap[dispName].pokemon[st.pokemon].wins += Number(st.battle_won || 0);
                playerMap[dispName].pokemon[st.pokemon].battles += 1;
            });

            const players = Object.keys(playerMap).filter(p => !playerFilter || p.toLowerCase().includes(playerFilter));

            if (players.length === 0) {
                grid.innerHTML = '<div class="status-msg">No player statistics found for this season.</div>';
                return;
            }

            grid.innerHTML = players.map(player => {
                const pokeEntries = Object.entries(playerMap[player].pokemon);
                const pokemonTiles = pokeEntries.map(([poke, data]) => `
                    <div class="pokemon-tile">
                        <strong>${poke}</strong>
                        <span>${data.kos} KOs | ${data.wins} Ws</span>
                    </div>
                `).join('');

                return `
                    <div class="player-card">
                        <div class="player-card-header">
                            <h3>${player}</h3>
                            <div class="metrics-badge">Mon Count: <strong>${pokeEntries.length}</strong></div>
                        </div>
                        <div class="pokemon-tile-grid">
                            ${pokemonTiles || '<span style="color:var(--text-muted); font-size:0.85rem;">No Pokémon logged yet.</span>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
