<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Analytics Hub - Pokémon Draft League</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --card-hover: #26334d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-blue);
        }

        .nav-back {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: bold;
        }

        .nav-back:hover {
            color: var(--text-main);
        }

        .container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        /* Top Filter Bar */
        .filter-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        select, input {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem 0.8rem;
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* Navigation Tabs */
        .tabs-container {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .tab-button {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab-button:hover {
            color: var(--text-main);
        }

        .tab-button.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Match Cards Layout (Statdex) */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.2rem;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
            margin-bottom: 0.8rem;
        }

        .match-players {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
        }

        .winner-tag {
            color: #4ade80;
        }

        .replay-link-btn {
            display: inline-block;
            background-color: var(--border-color);
            color: var(--text-main);
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .replay-link-btn:hover {
            background-color: var(--accent-blue);
        }

        /* Playerdex Cards */
        .playerdex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.2rem;
        }

        .player-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
            margin-bottom: 1rem;
        }

        .player-card-header h3 {
            margin: 0;
            color: var(--accent-blue);
        }

        .metrics-badge {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .pokemon-tile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }

        .pokemon-tile {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .pokemon-tile strong {
            display: block;
            color: var(--text-main);
        }

        .pokemon-tile span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-msg {
            color: var(--text-muted);
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Seasonal Analytics Hub</h1>
        <a href="index.html" class="nav-back">&larr; Back to Main Hub</a>
    </header>

    <div class="container">
        <!-- Top Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label for="seasonSelect">Select Season:</label>
                <select id="seasonSelect" onchange="loadSeasonalData()">
                    <option value="">Loading seasons...</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="weekSelect">Filter Week:</label>
                <select id="weekSelect" onchange="renderMatches()">
                    <option value="all">All Weeks</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="playerSearch">Search Player:</label>
                <input type="text" id="playerSearch" placeholder="Type player name..." onkeyup="renderMatches(); renderPlayerdex();">
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs-container">
            <button class="tab-button active" onclick="switchTab('statdex')">Seasonal Statdex (Matches)</button>
            <button class="tab-button" onclick="switchTab('playerdex')">Seasonal Playerdex (Rosters & Stats)</button>
            <button class="tab-button" onclick="switchTab('draftboard')">Draft Board & Budgets</button>
        </div>

        <!-- Tab 1: Statdex (Matches & Replays) -->
        <div id="statdex" class="tab-content active">
            <div id="matchGrid" class="match-grid">
                <div class="status-msg">Loading seasonal data...</div>
            </div>
        </div>

        <!-- Tab 2: Playerdex (Player & Pokémon Cards) -->
        <div id="playerdex" class="tab-content">
            <div id="playerdexGrid" class="playerdex-grid">
                <div class="status-msg">Loading player cards...</div>
            </div>
        </div>

        <!-- Tab 3: Draft Board -->
        <div id="draftboard" class="tab-content">
            <div id="draftBoardContent" class="status-msg">Draft board data will render here.</div>
        </div>
    </div>

    <script>
        // HARDCODED READ-ONLY TURSO CREDENTIALS FOR PUBLIC GITHUB PAGES
        const TURSO_DB_URL = "libsql://pokemon-draft-league-triple1195.aws-us-east-2.turso.io";
        const TURSO_READONLY_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicm8iLCJpYXQiOjE3OTMwMzUzMTksImlkIjoiMDFhMTc4NDMtYzQwMS03NTlhLWIzMmMtMTVlMGYxYWJlMDk4Iiwia2lkIjoiTzJTeHFzSmRxNGNXbnVGZkJoV2dHLUx6RVVEUVdSakxiZ3g2endqRWFFUSIsInJpZCI6IjBhNzQ4ZmIzLWJiNTAtNDMyMC1hN2FhLTg0NjI5NjM0ZGE2ZCJ9.CzhhhnATxbJ__bOMPHPXUckuEnHSAxlS5I25jlQEC-zHSrGPQW2hgW1Ngv3UT4xtIRmfAz6tkf3ZSvWaNLY2Aw";

        let rawMatches = [];
        let rawStats = [];

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        async function tursoQuery(statements) {
            if (!TURSO_DB_URL || !TURSO_READONLY_TOKEN || TURSO_READONLY_TOKEN.includes("YOUR_READ_ONLY_TOKEN")) {
                console.error('Turso DB credentials not configured in seasonal.html');
                document.getElementById('matchGrid').innerHTML = '<div class="status-msg" style="color:#ef4444;">Please replace TURSO_DB_URL and TURSO_READONLY_TOKEN with your read-only database credentials in seasonal.html.</div>';
                return null;
            }

            const httpUrl = TURSO_DB_URL.replace('libsql://', 'https://');
            const response = await fetch(`${httpUrl}/v2/pipeline`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${TURSO_READONLY_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    requests: statements.map(s => ({
                        type: 'execute',
                        stmt: { 
                            sql: s.sql, 
                            args: s.args ? s.args.map(arg => ({ 
                                type: typeof arg === 'number' ? 'integer' : 'text', 
                                value: String(arg) 
                            })) : [] 
                        }
                    }))
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Database query failed');
            
            return data.results.map(res => {
                if (res.type === 'error') throw new Error(res.error.message);
                const cols = res.response.result.cols.map(c => c.name);
                return res.response.result.rows.map(row => {
                    let obj = {};
                    cols.forEach((col, idx) => {
                        obj[col] = row[idx].value;
                    });
                    return obj;
                });
            });
        }

        async function initApp() {
            try {
                const results = await tursoQuery([{ sql: "SELECT season FROM seasons ORDER BY season DESC" }]);
                if (!results) return;

                const seasons = results[0];
                const seasonSelect = document.getElementById('seasonSelect');
                seasonSelect.innerHTML = '';

                if (!seasons || seasons.length === 0) {
                    seasonSelect.innerHTML = '<option value="">No seasons found</option>';
                    return;
                }

                seasons.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season;
                    opt.innerText = `Season ${s.season}`;
                    seasonSelect.appendChild(opt);
                });

                loadSeasonalData();
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        async function loadSeasonalData() {
            const season = document.getElementById('seasonSelect').value;
            if (!season) return;

            try {
                // Fetch matches and games
                const results = await tursoQuery([
                    {
                        sql: `SELECT m.match_id, m.conference, m.week, m.player_1, m.player_2, 
                                     g.game_number, g.replay_url, g.winner, g.turns 
                              FROM matches m 
                              LEFT JOIN match_games g ON m.match_id = g.match_id 
                              WHERE m.season = ? 
                              ORDER BY m.week ASC, m.match_id ASC, g.game_number ASC`,
                        args: [season]
                    },
                    {
                        sql: `SELECT s.player, s.pokemon, s.survived, s.battle_won, s.direct_kos, g.match_id, m.week
                              FROM match_pokemon_stats s
                              JOIN match_games g ON s.game_id = g.game_id
                              JOIN matches m ON g.match_id = m.match_id
                              WHERE m.season = ?`,
                        args: [season]
                    }
                ]);

                if (!results) return;

                rawMatches = results[0];
                rawStats = results[1];

                // Populate Week Filter
                const weeks = [...new Set(rawMatches.map(m => m.week))].sort((a, b) => a - b);
                const weekSelect = document.getElementById('weekSelect');
                weekSelect.innerHTML = '<option value="all">All Weeks</option>';
                weeks.forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w;
                    opt.innerText = `Week ${w}`;
                    weekSelect.appendChild(opt);
                });

                renderMatches();
                renderPlayerdex();
            } catch (err) {
                console.error("Error loading seasonal data:", err);
            }
        }

        function renderMatches() {
            const weekFilter = document.getElementById('weekSelect').value;
            const playerFilter = document.getElementById('playerSearch').value.toLowerCase();
            const grid = document.getElementById('matchGrid');

            let filtered = rawMatches.filter(m => {
                const matchWeek = String(m.week);
                const p1 = (m.player_1 || '').toLowerCase();
                const p2 = (m.player_2 || '').toLowerCase();

                const matchesWeek = (weekFilter === 'all' || matchWeek === weekFilter);
                const matchesPlayer = (!playerFilter || p1.includes(playerFilter) || p2.includes(playerFilter));
                return matchesWeek && matchesPlayer;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="status-msg">No matches found matching filters.</div>';
                return;
            }

            grid.innerHTML = filtered.map(m => {
                const isP1Winner = m.winner && m.winner.toLowerCase() === m.player_1.toLowerCase();
                const isP2Winner = m.winner && m.winner.toLowerCase() === m.player_2.toLowerCase();

                return `
                    <div class="match-card">
                        <div class="match-header">
                            <span>${m.conference || 'Conference'} • Week ${m.week}</span>
                            <span>Game ${m.game_number || 1} (${m.turns || 0} Turns)</span>
                        </div>
                        <div class="match-players">
                            <span class="${isP1Winner ? 'winner-tag' : ''}">${m.player_1}</span>
                            <span>vs</span>
                            <span class="${isP2Winner ? 'winner-tag' : ''}">${m.player_2}</span>
                        </div>
                        ${m.replay_url ? `<a href="${m.replay_url}" target="_blank" class="replay-link-btn">Watch Replay &rarr;</a>` : '<span style="font-size:0.85rem; color:var(--text-muted);">Replay pending</span>'}
                    </div>
                `;
            }).join('');
        }

        function renderPlayerdex() {
            const playerFilter = document.getElementById('playerSearch').value.toLowerCase();
            const grid = document.getElementById('playerdexGrid');

            const playerMap = {};
            rawStats.forEach(st => {
                if (!playerMap[st.player]) {
                    playerMap[st.player] = { pokemon: {} };
                }
                if (!playerMap[st.player].pokemon[st.pokemon]) {
                    playerMap[st.player].pokemon[st.pokemon] = { kos: 0, wins: 0, battles: 0 };
                }
                playerMap[st.player].pokemon[st.pokemon].kos += Number(st.direct_kos || 0);
                playerMap[st.player].pokemon[st.pokemon].wins += Number(st.battle_won || 0);
                playerMap[st.player].pokemon[st.pokemon].battles += 1;
            });

            const players = Object.keys(playerMap).filter(p => !playerFilter || p.toLowerCase().includes(playerFilter));

            if (players.length === 0) {
                grid.innerHTML = '<div class="status-msg">No player statistics found for this season.</div>';
                return;
            }

            grid.innerHTML = players.map(player => {
                const pokeEntries = Object.entries(playerMap[player].pokemon);
                
                const pokemonTiles = pokeEntries.map(([poke, data]) => `
                    <div class="pokemon-tile">
                        <strong>${poke}</strong>
                        <span>${data.kos} KOs | ${data.wins} Ws</span>
                    </div>
                `).join('');

                return `
                    <div class="player-card">
                        <div class="player-card-header">
                            <h3>${player}</h3>
                            <div class="metrics-badge">Mon Count: <strong>${pokeEntries.length}</strong></div>
                        </div>
                        <div class="pokemon-tile-grid">
                            ${pokemonTiles || '<span style="color:var(--text-muted); font-size:0.85rem;">No Pokémon logged yet.</span>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
