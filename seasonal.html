<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Analytics Hub - Pokémon Draft League</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --card-hover: #26334d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-blue);
        }

        .nav-back {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: bold;
        }

        .nav-back:hover {
            color: var(--text-main);
        }

        .container {
            max-width: 1300px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        /* Top Filter Bar */
        .filter-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        select, input {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.5rem 0.8rem;
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* Navigation Tabs */
        .tabs-container {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .tab-button {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab-button:hover {
            color: var(--text-main);
        }

        .tab-button.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Spreadsheet-Style Grid Theme */
        .sheet-match-container {
            background-color: #a3a3a3;
            border: 2px solid #333;
            padding: 12px;
            color: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 13px;
            margin-bottom: 2rem;
            border-radius: 4px;
            overflow-x: auto;
        }

        /* Top Scoreboard */
        .sheet-scoreboard {
            display: grid;
            grid-template-columns: 180px 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .sheet-box {
            background: #fff;
            border: 1px solid #000;
            padding: 6px;
            text-align: center;
        }

        .score-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            border: 2px solid #000;
        }

        .player-banner-left { background-color: #3b82f6; color: white; padding: 10px 16px; width: 35%; text-align: center; }
        .player-banner-right { background-color: #ef4444; color: white; padding: 10px 16px; width: 35%; text-align: center; }
        .vs-divider { font-size: 14px; color: #333; padding: 0 10px; }

        .game-summary-box {
            background: #fff;
            border: 2px solid #000;
            text-align: center;
        }
        .game-summary-header { font-weight: bold; background: #e5e7eb; border-bottom: 1px solid #000; padding: 2px; }
        .game-summary-winner { font-weight: bold; font-size: 15px; padding: 4px; }

        /* Main Match Layout: Left Roster Summaries + Right Game Breakdown Matrix */
        .sheet-main-grid {
            display: grid;
            grid-template-columns: 480px 1fr 1fr 1fr;
            gap: 12px;
        }

        /* Brought Team Overview Cards (Left Column) */
        .player-roster-card {
            background: #fff;
            border: 2px solid #000;
            margin-bottom: 12px;
        }

        .roster-header {
            background: #000;
            color: #fff;
            padding: 4px 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .roster-mon-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            border-top: 1px solid #000;
        }

        .mon-summary-tile {
            border-right: 1px solid #000;
            padding: 4px;
            text-align: center;
            font-size: 11px;
        }
        .mon-summary-tile:last-child { border-right: none; }
        .mon-sprite { width: 48px; height: 48px; object-fit: contain; }
        .mon-name { font-weight: bold; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat-row { display: flex; justify-content: space-between; border-top: 1px dashed #ccc; padding: 1px 2px; }

        /* Game Detail Columns (Right Side) */
        .game-detail-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-player-block {
            background: #fff;
            border: 2px solid #000;
        }

        .game-player-header {
            display: flex;
            justify-content: space-between;
            padding: 3px 6px;
            font-weight: bold;
            border-bottom: 1px solid #000;
        }
        .status-winner { background-color: #3b82f6; color: white; }
        .status-loser { background-color: #ef4444; color: white; }

        .game-mon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            background: #000;
            padding: 1px;
        }

        .game-mon-cell {
            background: #fff;
            padding: 4px;
            display: flex;
            gap: 4px;
            font-size: 11px;
        }

        .cell-sprite { width: 32px; height: 32px; object-fit: contain; }
        .cell-info { flex: 1; }
        .faint-badge { background: #ef4444; color: white; padding: 1px 3px; font-size: 9px; font-weight: bold; border-radius: 2px; }
        .survived-badge { background: #e5e7eb; color: #000; padding: 1px 3px; font-size: 9px; border-radius: 2px; }

        /* Playerdex Cards */
        .playerdex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.2rem;
        }

        .player-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
            margin-bottom: 1rem;
        }

        .player-card-header h3 {
            margin: 0;
            color: var(--accent-blue);
        }

        .metrics-badge {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .pokemon-tile-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
        }

        .pokemon-tile {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .pokemon-tile strong {
            display: block;
            color: var(--text-main);
        }

        .pokemon-tile span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-msg {
            color: var(--text-muted);
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Seasonal Analytics Hub</h1>
        <a href="index.html" class="nav-back">&larr; Back to Main Hub</a>
    </header>

    <div class="container">
        <!-- Top Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label for="seasonSelect">Select Season:</label>
                <select id="seasonSelect" onchange="loadSeasonalData()">
                    <option value="">Loading seasons...</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="weekSelect">Filter Week:</label>
                <select id="weekSelect" onchange="renderMatchesSheetUI()">
                    <option value="all">All Weeks</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="playerSearch">Search Player:</label>
                <input type="text" id="playerSearch" placeholder="Type player name..." onkeyup="renderMatchesSheetUI(); renderPlayerdex();">
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs-container">
            <button class="tab-button active" onclick="switchTab('statdex')">Seasonal Statdex (Matches)</button>
            <button class="tab-button" onclick="switchTab('playerdex')">Seasonal Playerdex (Rosters & Stats)</button>
            <button class="tab-button" onclick="switchTab('draftboard')">Draft Board & Budgets</button>
        </div>

        <!-- Tab 1: Statdex (Spreadsheet Match View) -->
        <div id="statdex" class="tab-content active">
            <div id="matchGrid">
                <div class="status-msg">Loading seasonal data...</div>
            </div>
        </div>

        <!-- Tab 2: Playerdex (Player & Pokémon Cards) -->
        <div id="playerdex" class="tab-content">
            <div id="playerdexGrid" class="playerdex-grid">
                <div class="status-msg">Loading player cards...</div>
            </div>
        </div>

        <!-- Tab 3: Draft Board -->
        <div id="draftboard" class="tab-content">
            <div id="draftBoardContent" class="status-msg">Draft board data will render here.</div>
        </div>
    </div>

    <script>
        // HARDCODED READ-ONLY TURSO CREDENTIALS FOR PUBLIC GITHUB PAGES
        const TURSO_DB_URL = "libsql://pokemon-draft-league-triple1195.aws-us-east-2.turso.io";
        const TURSO_READONLY_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicm8iLCJpYXQiOjE3OTMwMzUzMTksImlkIjoiMDFhMTc4NDMtYzQwMS03NTlhLWIzMmMtMTVlMGYxYWJlMDk4Iiwia2lkIjoiTzJTeHFzSmRxNGNXbnVGZkJoV2dHLUx6RVVEUVdSakxiZ3g2endqRWFFUSIsInJpZCI6IjBhNzQ4ZmIzLWJiNTAtNDMyMC1hN2FhLTg0NjI5NjM0ZGE2ZCJ9.CzhhhnATxbJ__bOMPHPXUckuEnHSAxlS5I25jlQEC-zHSrGPQW2hgW1Ngv3UT4xtIRmfAz6tkf3ZSvWaNLY2Aw";

        let rawMatches = [];
        let rawStats = [];

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        async function tursoQuery(statements) {
            if (!TURSO_DB_URL || !TURSO_READONLY_TOKEN || TURSO_READONLY_TOKEN.includes("YOUR_READ_ONLY_TOKEN")) {
                console.error('Turso DB credentials not configured in seasonal.html');
                document.getElementById('matchGrid').innerHTML = '<div class="status-msg" style="color:#ef4444;">Please replace TURSO_DB_URL and TURSO_READONLY_TOKEN with your read-only database credentials in seasonal.html.</div>';
                return null;
            }

            const httpUrl = TURSO_DB_URL.replace('libsql://', 'https://');
            const response = await fetch(`${httpUrl}/v2/pipeline`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${TURSO_READONLY_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    requests: statements.map(s => ({
                        type: 'execute',
                        stmt: { 
                            sql: s.sql, 
                            args: s.args ? s.args.map(arg => ({ 
                                type: typeof arg === 'number' ? 'integer' : 'text', 
                                value: String(arg) 
                            })) : [] 
                        }
                    }))
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Database query failed');
            
            return data.results.map(res => {
                if (res.type === 'error') throw new Error(res.error.message);
                const cols = res.response.result.cols.map(c => c.name);
                return res.response.result.rows.map(row => {
                    let obj = {};
                    cols.forEach((col, idx) => {
                        obj[col] = row[idx].value;
                    });
                    return obj;
                });
            });
        }

        async function initApp() {
            try {
                const results = await tursoQuery([{ sql: "SELECT season FROM seasons ORDER BY season DESC" }]);
                if (!results) return;

                const seasons = results[0];
                const seasonSelect = document.getElementById('seasonSelect');
                seasonSelect.innerHTML = '';

                if (!seasons || seasons.length === 0) {
                    seasonSelect.innerHTML = '<option value="">No seasons found</option>';
                    return;
                }

                seasons.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season;
                    opt.innerText = `Season ${s.season}`;
                    seasonSelect.appendChild(opt);
                });

                loadSeasonalData();
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        async function loadSeasonalData() {
            const season = document.getElementById('seasonSelect').value;
            if (!season) return;

            try {
                const results = await tursoQuery([
                    {
                        sql: `SELECT m.match_id, m.conference, m.week, m.player_1, m.player_2, 
                                     g.game_number, g.game_id, g.replay_url, g.winner, g.turns 
                              FROM matches m 
                              LEFT JOIN match_games g ON m.match_id = g.match_id 
                              WHERE m.season = ? 
                              ORDER BY m.week ASC, m.match_id ASC, g.game_number ASC`,
                        args: [season]
                    },
                    {
                        sql: `SELECT s.stat_id, s.game_id, s.player, s.pokemon, s.nickname, s.faint_type, s.faint_source, s.faint_move,
                                     s.direct_kos, s.indirect_kos, s.self_kos, s.total_damage, s.direct_damage, s.indirect_damage,
                                     s.hazard_damage, s.hits_taken, s.damage_taken, s.damage_healed, s.active_turns, s.survived, s.fainted, s.battle_won
                              FROM match_pokemon_stats s
                              JOIN match_games g ON s.game_id = g.game_id
                              JOIN matches m ON g.match_id = m.match_id
                              WHERE m.season = ?`,
                        args: [season]
                    }
                ]);

                if (!results) return;

                rawMatches = results[0];
                rawStats = results[1];

                const weeks = [...new Set(rawMatches.map(m => m.week))].sort((a, b) => a - b);
                const weekSelect = document.getElementById('weekSelect');
                weekSelect.innerHTML = '<option value="all">All Weeks</option>';
                weeks.forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w;
                    opt.innerText = `Week ${w}`;
                    weekSelect.appendChild(opt);
                });

                renderMatchesSheetUI();
                renderPlayerdex();
            } catch (err) {
                console.error("Error loading seasonal data:", err);
            }
        }

        function renderMatchesSheetUI() {
            const weekFilter = document.getElementById('weekSelect').value;
            const playerFilter = document.getElementById('playerSearch').value.toLowerCase();
            const grid = document.getElementById('matchGrid');

            const matchGroups = {};
            rawMatches.forEach(m => {
                const matchWeek = String(m.week);
                const p1 = (m.player_1 || '').toLowerCase();
                const p2 = (m.player_2 || '').toLowerCase();

                const matchesWeek = (weekFilter === 'all' || matchWeek === weekFilter);
                const matchesPlayer = (!playerFilter || p1.includes(playerFilter) || p2.includes(playerFilter));

                if (matchesWeek && matchesPlayer) {
                    if (!matchGroups[m.match_id]) {
                        matchGroups[m.match_id] = { info: m, games: [] };
                    }
                    if (m.game_number) {
                        matchGroups[m.match_id].games.push(m);
                    }
                }
            });

            const matchIds = Object.keys(matchGroups);

            if (matchIds.length === 0) {
                grid.innerHTML = '<div class="status-msg">No matches found matching filters.</div>';
                return;
            }

            grid.innerHTML = matchIds.map(matchId => {
                const match = matchGroups[matchId];
                const info = match.info;
                const games = match.games;

                let p1Wins = 0;
                let p2Wins = 0;
                games.forEach(g => {
                    if (g.winner && g.winner.toLowerCase() === info.player_1.toLowerCase()) p1Wins++;
                    if (g.winner && g.winner.toLowerCase() === info.player_2.toLowerCase()) p2Wins++;
                });

                const gameHeadersHTML = [1, 2, 3].map(gNum => {
                    const gameData = games.find(g => Number(g.game_number) === gNum);
                    if (!gameData) {
                        return `
                            <div class="game-summary-box">
                                <div class="game-summary-header">Game ${gNum}</div>
                                <div class="game-summary-winner" style="color:#94a3b8; font-size:12px;">N/A</div>
                            </div>
                        `;
                    }
                    return `
                        <div class="game-summary-box">
                            <div class="game-summary-header">Game ${gNum} (${gameData.turns || 0}T)</div>
                            <div class="game-summary-winner">${gameData.winner || 'Pending'}</div>
                            ${gameData.replay_url ? `<a href="${gameData.replay_url}" target="_blank" style="font-size:11px;">Replay</a>` : ''}
                        </div>
                    `;
                }).join('');

                return `
                    <div class="sheet-match-container">
                        <div class="sheet-scoreboard">
                            <div class="sheet-box">
                                <div><strong>Week:</strong> ${info.week}</div>
                                <div><strong>Conf:</strong> ${info.conference || 1}</div>
                            </div>
                            <div class="score-header">
                                <div class="player-banner-left">${info.player_1} <span style="margin-left:8px;">${p1Wins}</span></div>
                                <span class="vs-divider">VS</span>
                                <div class="player-banner-right"><span style="margin-right:8px;">${p2Wins}</span> ${info.player_2}</div>
                            </div>
                            ${gameHeadersHTML}
                        </div>

                        <div class="sheet-main-grid">
                            <div>
                                <div class="player-roster-card">
                                    <div class="roster-header">
                                        <span>Player: ${info.player_1}</span>
                                    </div>
                                    <div class="roster-mon-grid">
                                        ${renderPlayerMonSummaries(info.player_1, games)}
                                    </div>
                                </div>

                                <div class="player-roster-card">
                                    <div class="roster-header">
                                        <span>Player: ${info.player_2}</span>
                                    </div>
                                    <div class="roster-mon-grid">
                                        ${renderPlayerMonSummaries(info.player_2, games)}
                                    </div>
                                </div>
                            </div>

                            ${[1, 2, 3].map(gNum => renderGameDetailColumn(games.find(g => Number(g.game_number) === gNum), info)).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPlayerMonSummaries(playerName, games) {
            const gameIds = games.map(g => g.game_id);
            const playerStats = rawStats.filter(s => s.player && s.player.toLowerCase() === playerName.toLowerCase() && gameIds.includes(s.game_id));
            
            const aggregated = {};
            playerStats.forEach(s => {
                if (!aggregated[s.pokemon]) {
                    aggregated[s.pokemon] = { species: s.pokemon, directKos: 0, indirectKos: 0, teamKos: 0 };
                }
                aggregated[s.pokemon].directKos += Number(s.direct_kos || 0);
                aggregated[s.pokemon].indirectKos += Number(s.indirect_kos || 0);
                aggregated[s.pokemon].teamKos += Number(s.self_kos || 0);
            });

            const mons = Object.values(aggregated).slice(0, 6);
            if (mons.length === 0) {
                return '<div style="padding:10px; grid-column:span 6; text-align:center;">No Pokémon data logged</div>';
            }

            return mons.map(m => {
                const formattedName = m.species.toLowerCase().replace(/[^a-z0-9]/g, '');
                const spriteUrl = `https://play.pokemonshowdown.com/sprites/gen5/${formattedName}.png`;

                return `
                    <div class="mon-summary-tile">
                        <img src="${spriteUrl}" class="mon-sprite" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png'" />
                        <div class="mon-name">${m.species}</div>
                        <div class="stat-row"><span>Direct:</span> <strong>${m.directKos}</strong></div>
                        <div class="stat-row"><span>Indirect:</span> <strong>${m.indirectKos}</strong></div>
                        <div class="stat-row"><span>Team:</span> <strong>${m.teamKos}</strong></div>
                    </div>
                `;
            }).join('');
        }

        function renderGameDetailColumn(gameData, matchInfo) {
            if (!gameData) {
                return `<div class="game-detail-column"><div style="background:#fff; border:2px solid #000; padding:20px; text-align:center; color:#666;">Game Not Played</div></div>`;
            }

            return `
                <div class="game-detail-column">
                    <div class="game-player-block">
                        <div class="game-player-header ${gameData.winner === matchInfo.player_1 ? 'status-winner' : 'status-loser'}">
                            <span>${matchInfo.player_1}</span>
                            <span>${gameData.winner === matchInfo.player_1 ? 'Winner' : 'Loser'}</span>
                        </div>
                        <div class="game-mon-grid">
                            ${renderGameMonCells(gameData.game_id, matchInfo.player_1)}
                        </div>
                    </div>

                    <div class="game-player-block">
                        <div class="game-player-header ${gameData.winner === matchInfo.player_2 ? 'status-winner' : 'status-loser'}">
                            <span>${matchInfo.player_2}</span>
                            <span>${gameData.winner === matchInfo.player_2 ? 'Winner' : 'Loser'}</span>
                        </div>
                        <div class="game-mon-grid">
                            ${renderGameMonCells(gameData.game_id, matchInfo.player_2)}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGameMonCells(gameId, playerName) {
            const gameStats = rawStats.filter(s => s.player && s.player.toLowerCase() === playerName.toLowerCase() && s.game_id === gameId);
            const mons = gameStats.slice(0, 6);

            if (mons.length === 0) {
                return '<div style="padding:10px; grid-column:span 2; background:#fff; text-align:center;">No log stats</div>';
            }

            return mons.map(m => {
                const formattedName = m.pokemon.toLowerCase().replace(/[^a-z0-9]/g, '');
                const spriteUrl = `https://play.pokemonshowdown.com/sprites/gen5/${formattedName}.png`;
                const isFainted = Number(m.survived) === 0;

                return `
                    <div class="game-mon-cell">
                        <img src="${spriteUrl}" class="cell-sprite" onerror="this.style.display='none'" />
                        <div class="cell-info">
                            <div><strong>KOs:</strong> ${m.direct_kos || 0}</div>
                            <div style="margin-top:2px;">
                                ${isFainted ? '<span class="faint-badge">Faint</span>' : '<span class="survived-badge">Survived</span>'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPlayerdex() {
            const playerFilter = document.getElementById('playerSearch').value.toLowerCase();
            const grid = document.getElementById('playerdexGrid');

            const playerMap = {};
            rawStats.forEach(st => {
                if (!playerMap[st.player]) {
                    playerMap[st.player] = { pokemon: {} };
                }
                if (!playerMap[st.player].pokemon[st.pokemon]) {
                    playerMap[st.player].pokemon[st.pokemon] = { kos: 0, wins: 0, battles: 0 };
                }
                playerMap[st.player].pokemon[st.pokemon].kos += Number(st.direct_kos || 0);
                playerMap[st.player].pokemon[st.pokemon].wins += Number(st.battle_won || 0);
                playerMap[st.player].pokemon[st.pokemon].battles += 1;
            });

            const players = Object.keys(playerMap).filter(p => !playerFilter || p.toLowerCase().includes(playerFilter));

            if (players.length === 0) {
                grid.innerHTML = '<div class="status-msg">No player statistics found for this season.</div>';
                return;
            }

            grid.innerHTML = players.map(player => {
                const pokeEntries = Object.entries(playerMap[player].pokemon);
                
                const pokemonTiles = pokeEntries.map(([poke, data]) => `
                    <div class="pokemon-tile">
                        <strong>${poke}</strong>
                        <span>${data.kos} KOs | ${data.wins} Ws</span>
                    </div>
                `).join('');

                return `
                    <div class="player-card">
                        <div class="player-card-header">
                            <h3>${player}</h3>
                            <div class="metrics-badge">Mon Count: <strong>${pokeEntries.length}</strong></div>
                        </div>
                        <div class="pokemon-tile-grid">
                            ${pokemonTiles || '<span style="color:var(--text-muted); font-size:0.85rem;">No Pokémon logged yet.</span>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
