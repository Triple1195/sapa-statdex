    <script>
        let rawMatches = [];
        let rawStats = [];
        let rawDraftCosts = {}; 
        let totalSeasonBudget = 120; 
        
        window.playerAliasesMap = {}; 
        window.displayToTagMap = {};   

        window.addEventListener('DOMContentLoaded', () => { initApp(); });

        // Helper function to resolve draft cost for alternate forms, Megas, regional & cosmetic variants
        function getDraftCost(species, draftCosts) {
            if (!species) return 0;

            // Build a case-insensitive, punctuation-normalized lookup map on first run
            if (!window._normalizedDraftCosts) {
                window._normalizedDraftCosts = {};
                for (const [key, val] of Object.entries(draftCosts)) {
                    const normKey = key.toLowerCase().replace(/[^a-z0-9]/g, '');
                    window._normalizedDraftCosts[normKey] = Number(val);
                }
            }

            const lookup = (name) => {
                if (draftCosts[name] !== undefined) return Number(draftCosts[name]);
                const norm = name.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (window._normalizedDraftCosts[norm] !== undefined) {
                    return window._normalizedDraftCosts[norm];
                }
                return undefined;
            };

            // 1. Direct / normalized match (handles case & hyphen differences)
            let cost = lookup(species);
            if (cost !== undefined) return cost;

            // 2. Mega Evolutions (handles -Mega, -Mega-X, -Mega-Y -> "Mega Charizard X", "Charizard-Mega-X", or base "Charizard")
            if (species.includes('-Mega')) {
                const parts = species.split('-Mega');
                const base = parts[0];
                const suffix = parts[1] ? parts[1].replace('-', ' ').trim() : ''; // e.g., "X" or "Y"

                const candidates = [
                    `Mega ${base}${suffix ? ' ' + suffix : ''}`,
                    `${base}-Mega${suffix ? '-' + suffix : ''}`,
                    base
                ];
                for (const c of candidates) {
                    cost = lookup(c);
                    if (cost !== undefined) return cost;
                }
            }

            // 3. Regional Forms (Alola, Galar, Hisui, Paldea)
            const regionals = [
                { tag: '-Alola', prefix: 'Alolan' },
                { tag: '-Galar', prefix: 'Galarian' },
                { tag: '-Hisui', prefix: 'Hisuian' },
                { tag: '-Paldea', prefix: 'Paldean' }
            ];
            for (const r of regionals) {
                if (species.includes(r.tag)) {
                    const base = species.replace(r.tag, '');
                    cost = lookup(`${r.prefix} ${base}`) ?? lookup(`${base}${r.tag}`) ?? lookup(base);
                    if (cost !== undefined) return cost;
                }
            }

            // 4. Forces of Nature / Incarnate Forms (Thundurus, Landorus, Tornadus, Enamorus)
            const genies = ['Thundurus', 'Landorus', 'Tornadus', 'Enamorus'];
            if (genies.includes(species)) {
                cost = lookup(`${species}-Incarnate`) ?? lookup(`${species} Incarnate`);
                if (cost !== undefined) return cost;
            }

            // 5. Fallback to base species name (handles cosmetic forms like Gastrodon-East -> Gastrodon, Vivillon-Polar -> Vivillon, etc.)
            if (species.includes('-')) {
                const baseSpecies = species.split('-')[0];
                cost = lookup(baseSpecies);
                if (cost !== undefined) return cost;
            }

            return 0;
        }

        async function tursoQuery(statements) {
            if (typeof TURSO_DB_URL === 'undefined' || typeof TURSO_READONLY_TOKEN === 'undefined' || TURSO_READONLY_TOKEN.includes("YOUR_READ_ONLY_TOKEN")) {
                document.getElementById('matchGrid').innerHTML = '<div class="status-msg" style="color:#d93025;">Please configure your Turso read-only credentials in config.js.</div>';
                return null;
            }

            const httpUrl = TURSO_DB_URL.replace('libsql://', 'https://');
            const response = await fetch(`${httpUrl}/v2/pipeline`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${TURSO_READONLY_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    requests: statements.map(s => ({
                        type: 'execute',
                        stmt: { 
                            sql: s.sql, 
                            args: s.args ? s.args.map(arg => ({ type: typeof arg === 'number' ? 'integer' : 'text', value: String(arg) })) : [] 
                        }
                    }))
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Database query failed');
            
            return data.results.map(res => {
                if (res.type === 'error') throw new Error(res.error.message);
                const cols = res.response.result.cols.map(c => c.name);
                return res.response.result.rows.map(row => {
                    let obj = {};
                    cols.forEach((col, idx) => { obj[col] = row[idx].value; });
                    return obj;
                });
            });
        }

        async function initApp() {
            try {
                const aliasResult = await tursoQuery([{ sql: "SELECT display_name, showdown_tag FROM player_aliases" }]);
                if (aliasResult && aliasResult[0]) {
                    aliasResult[0].forEach(row => {
                        const disp = (row.display_name || '').trim();
                        const tag = (row.showdown_tag || '').trim();
                        if (disp && tag) {
                            window.playerAliasesMap[tag.toLowerCase()] = disp;
                            window.displayToTagMap[disp.toLowerCase()] = tag;
                        }
                    });
                }

                const results = await tursoQuery([{ sql: "SELECT season FROM seasons ORDER BY season DESC" }]);
                if (!results) return;

                const seasons = results[0];
                const seasonSelect = document.getElementById('seasonSelect');
                seasonSelect.innerHTML = '';

                if (!seasons || seasons.length === 0) {
                    seasonSelect.innerHTML = '<option value="">No seasons found</option>';
                    return;
                }

                seasons.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.season;
                    opt.innerText = `Season ${s.season}`;
                    seasonSelect.appendChild(opt);
                });

                loadSeasonalData();
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        async function loadSeasonalData() {
            const season = document.getElementById('seasonSelect').value;
            if (!season) return;

            try {
                const results = await tursoQuery([
                    {
                        sql: `SELECT m.match_id, m.conference, m.week, m.player_1, m.player_2, 
                                     g.game_number, g.game_id, g.replay_url, g.winner, g.turns 
                              FROM matches m 
                              LEFT JOIN match_games g ON m.match_id = g.match_id 
                              WHERE m.season = ? 
                              ORDER BY m.week ASC, m.conference ASC, m.match_id ASC, g.game_number ASC`,
                        args: [season]
                    },
                    {
                        sql: `SELECT s.stat_id, s.game_id, s.player, s.pokemon, s.nickname, s.faint_type, s.faint_source, s.faint_move,
                                     s.direct_kos, s.indirect_kos, s.self_kos, s.total_damage, s.direct_damage, s.indirect_damage,
                                     s.hazard_damage, s.hits_taken, s.damage_taken, s.damage_healed, s.active_turns, s.survived, s.fainted, s.battle_won
                              FROM match_pokemon_stats s
                              JOIN match_games g ON s.game_id = g.game_id
                              JOIN matches m ON g.match_id = m.match_id
                              WHERE m.season = ?`,
                        args: [season]
                    },
                    {
                        sql: `SELECT pokemon_name, draft_cost FROM pokemon_draft_costs WHERE season = ?`,
                        args: [season]
                    },
                    {
                        sql: `SELECT total_draft_budget FROM seasons WHERE season = ?`,
                        args: [season]
                    }
                ]);

                if (!results) return;

                rawMatches = results[0];
                rawStats = results[1];
                
                rawDraftCosts = {};
                window._normalizedDraftCosts = null;
                if (results[2]) {
                    results[2].forEach(row => {
                        rawDraftCosts[row.pokemon_name] = Number(row.draft_cost || 0);
                    });
                }

                if (results[3] && results[3][0] && results[3][0].total_draft_budget) {
                    totalSeasonBudget = Number(results[3][0].total_draft_budget);
                }

                const weeks = [...new Set(rawMatches.map(m => m.week))].sort((a, b) => a - b);
                const weekSelect = document.getElementById('weekSelect');
                weekSelect.innerHTML = '<option value="all">All Weeks</option>';
                weeks.forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w;
                    opt.innerText = `Week ${w}`;
                    weekSelect.appendChild(opt);
                });

                renderMatchesSheetUI();
                renderPlayerdex();
            } catch (err) {
                console.error("Error loading seasonal data:", err);
            }
        }

        function calculateTotalHazardDamage(rawPlayerName, games) {
            const gameIds = games.map(g => String(g.game_id));
            const showdownTag = getShowdownTag(rawPlayerName).toLowerCase();
            const displayName = getDisplayName(rawPlayerName).toLowerCase();
            
            const playerStats = rawStats.filter(s => {
                const statPlayer = (s.player || '').trim().toLowerCase();
                return (statPlayer === showdownTag || statPlayer === displayName || getDisplayName(s.player).toLowerCase() === displayName) && gameIds.includes(String(s.game_id));
            });

            let total = 0;
            playerStats.forEach(s => {
                total += Number(s.hazard_damage || 0);
            });
            return total;
        }

            const playerStats = rawStats.filter(s => {

                return (statPlayer === showdownTag || statPlayer === displayName || getDisplayName(s.player).toLowerCase() === displayName) && gameIds.includes(String(s.game_id));
            });
            
            const aggregated = {};
            playerStats.forEach(s => {
                if (!aggregated[s.pokemon]) {
                    aggregated[s.pokemon] = { 
                        species: s.pokemon, 
                        nickname: s.nickname || s.pokemon,
                        directKos: 0, 
                        indirectKos: 0, 
                        teamKos: 0,

       // Render Full Playerdex View Separated by Conference and Sorted by Record
        function renderPlayerdex() {
            const playerFilter = document.getElementById('playerSearch').value.toLowerCase();
            const grid = document.getElementById('playerdexGrid');

            // 1. Calculate Player Set & Game Records, and map players to conferences
            const playerRecords = {};
            const playerConferences = {};
            const matchGroups = {};

            rawMatches.forEach(m => {
                if (!matchGroups[m.match_id]) {
                    matchGroups[m.match_id] = { info: m, games: [] };
                }
                if (m.game_number) {
                    matchGroups[m.match_id].games.push(m);
                }
            });

            Object.values(matchGroups).forEach(matchObj => {
                const info = matchObj.info;
                const games = matchObj.games;
                if (!info.player_1 || !info.player_2) return;

                const p1 = getDisplayName(info.player_1);
                const p2 = getDisplayName(info.player_2);
                const conf = info.conference ? String(info.conference) : "Main";

                playerConferences[p1] = conf;
                playerConferences[p2] = conf;

                if (!playerRecords[p1]) playerRecords[p1] = { setWins: 0, setLosses: 0, gameWins: 0, gameLosses: 0 };
                if (!playerRecords[p2]) playerRecords[p2] = { setWins: 0, setLosses: 0, gameWins: 0, gameLosses: 0 };

                let p1GameWins = 0;
                let p2GameWins = 0;

                games.forEach(g => {
                    const winner = getDisplayName(g.winner);
                    if (winner) {
                        if (winner.toLowerCase() === p1.toLowerCase()) {
                            p1GameWins++;
                            playerRecords[p1].gameWins++;
                            playerRecords[p2].gameLosses++;
                        } else if (winner.toLowerCase() === p2.toLowerCase()) {
                            p2GameWins++;
                            playerRecords[p2].gameWins++;
                            playerRecords[p1].gameLosses++;
                        }
                    }
                });

                if (games.length > 0) {
                    if (p1GameWins > p2GameWins) {
                        playerRecords[p1].setWins++;
                        playerRecords[p2].setLosses++;
                    } else if (p2GameWins > p1GameWins) {
                        playerRecords[p2].setWins++;
                        playerRecords[p1].setLosses++;
                    }
                }
            });

            // 2. Build player weekly schedules from rawMatches
            const playerSchedules = {};
            Object.values(matchGroups).forEach(matchObj => {
                const info = matchObj.info;
                const games = matchObj.games;
                if (!info.player_1 || !info.player_2) return;

                const p1 = getDisplayName(info.player_1);
                const p2 = getDisplayName(info.player_2);
                const weekNum = Number(info.week || 0);
                if (!weekNum) return;

                let p1Wins = 0;
                let p2Wins = 0;
                games.forEach(g => {
                    const w = getDisplayName(g.winner);
                    if (w.toLowerCase() === p1.toLowerCase()) p1Wins++;
                    if (w.toLowerCase() === p2.toLowerCase()) p2Wins++;
                });

                const hasPlayed = games.length > 0 && (p1Wins > 0 || p2Wins > 0 || games.some(g => g.winner));

                if (!playerSchedules[p1]) playerSchedules[p1] = [];
                if (!playerSchedules[p2]) playerSchedules[p2] = [];

                playerSchedules[p1].push({ week: weekNum, opponent: p2, pWins: p1Wins, oWins: p2Wins, played: hasPlayed });
                playerSchedules[p2].push({ week: weekNum, opponent: p1, pWins: p2Wins, oWins: p1Wins, played: hasPlayed });
            });

            // 3. Group stats by player and collect all unique nicknames per pokemon
            const playerMap = {};
            rawStats.forEach(st => {
                const dispName = getDisplayName(st.player);
                if (!playerMap[dispName]) {
                    playerMap[dispName] = { pokemon: {} };
                }
                if (!playerMap[dispName].pokemon[st.pokemon]) {
                    playerMap[dispName].pokemon[st.pokemon] = {
                        species: st.pokemon,
                        nicknamesSet: new Set(),
                        timesBrought: 0,
                        battlesActive: 0,
                        directKo: 0,
                        indirectKo: 0,
                        damageDealt: 0,
                        damageDirect: 0,
                        damageIndirect: 0,
                        hitsTaken: 0,
                        damageTaken: 0,
                        damageHeal: 0,
                        activeTurns: 0,
                        survived: 0,
                        fainted: 0,
                        battleWon: 0
                    };
                }
                const pObj = playerMap[dispName].pokemon[st.pokemon];
                if (st.nickname && st.nickname.trim() !== "" && st.nickname !== st.pokemon) {
                    pObj.nicknamesSet.add(st.nickname.trim());
                }
                pObj.timesBrought += 1;
                pObj.battlesActive += 1;
                pObj.directKo += Number(st.direct_kos || 0);
                pObj.indirectKo += Number(st.indirect_kos || 0);
                pObj.damageDealt += Number(st.total_damage || 0);
                pObj.damageDirect += Number(st.direct_damage || 0);
                pObj.damageIndirect += Number(st.indirect_damage || 0);
                pObj.hitsTaken += Number(st.hits_taken || 0);
                pObj.damageTaken += Number(st.damage_taken || 0);
                pObj.damageHeal += Number(st.damage_healed || 0);
                pObj.activeTurns += Number(st.active_turns || 0);
                pObj.survived += Number(st.survived || 0);
                pObj.fainted += Number(st.fainted || 0);
                pObj.battleWon += Number(st.battle_won || 0);
            });

            // 3b. Merge base Pokémon stats into their corresponding Mega form per player
            Object.keys(playerMap).forEach(dispName => {
                const monDict = playerMap[dispName].pokemon;
                const allSpecies = Object.keys(monDict);

                const megaSpeciesList = allSpecies.filter(sp => sp.includes('-Mega'));

                const baseToMegas = {};
                megaSpeciesList.forEach(megaSp => {
                    const baseSp = megaSp.split('-Mega')[0];
                    if (!baseToMegas[baseSp]) baseToMegas[baseSp] = [];
                    baseToMegas[baseSp].push(megaSp);
                });

                Object.entries(baseToMegas).forEach(([baseSp, megas]) => {
                    if (!monDict[baseSp]) return;

                    megas.sort();
                    const targetMega = megas[0];
                    const baseObj = monDict[baseSp];
                    const megaObj = monDict[targetMega];

                    baseObj.nicknamesSet.forEach(nick => megaObj.nicknamesSet.add(nick));
                    megaObj.timesBrought += baseObj.timesBrought;
                    megaObj.battlesActive += baseObj.battlesActive;
                    megaObj.directKo += baseObj.directKo;
                    megaObj.indirectKo += baseObj.indirectKo;
                    megaObj.damageDealt += baseObj.damageDealt;
                    megaObj.damageDirect += baseObj.damageDirect;
                    megaObj.damageIndirect += baseObj.damageIndirect;
                    megaObj.hitsTaken += baseObj.hitsTaken;
                    megaObj.damageTaken += baseObj.damageTaken;
                    megaObj.damageHeal += baseObj.damageHeal;
                    megaObj.activeTurns += baseObj.activeTurns;
                    megaObj.survived += baseObj.survived;
                    megaObj.fainted += baseObj.fainted;
                    megaObj.battleWon += baseObj.battleWon;

                    delete monDict[baseSp];
                });
            });

            // 4. Group players by Conference
            const conferenceMap = {};
            Object.keys(playerMap).forEach(player => {
                if (playerFilter && !player.toLowerCase().includes(playerFilter)) return;
                const conf = playerConferences[player] || "Main";
                if (!conferenceMap[conf]) conferenceMap[conf] = [];
                conferenceMap[conf].push(player);
            });

            const confKeys = Object.keys(conferenceMap).sort();
            if (confKeys.length === 0) {
                grid.innerHTML = '<div class="status-msg">No player records found for this season.</div>';
                return;
            }

            // 5. Sort players within each conference by record
            confKeys.forEach(conf => {
                conferenceMap[conf].sort((a, b) => {
                    const recA = playerRecords[a] || { setWins: 0, setLosses: 0, gameWins: 0, gameLosses: 0 };
                    const recB = playerRecords[b] || { setWins: 0, setLosses: 0, gameWins: 0, gameLosses: 0 };
                    if (recB.setWins !== recA.setWins) return recB.setWins - recA.setWins;
                    if (recA.setLosses !== recB.setLosses) return recA.setLosses - recB.setLosses;
                    return recB.gameWins - recA.gameWins;
                });
            });

            // 6. Build HTML for each conference and its sorted players
            grid.innerHTML = confKeys.map(conf => {
                const playersInConf = conferenceMap[conf];
                if (playersInConf.length === 0) return '';

                const playerContainersHTML = playersInConf.map(player => {
                    const playerData = playerMap[player];
                    const pokemons = Object.values(playerData.pokemon);
                    const rec = playerRecords[player] || { setWins: 0, setLosses: 0, gameWins: 0, gameLosses: 0 };
                    const sched = playerSchedules[player] || [];
                    sched.sort((a, b) => a.week - b.week);

                    const scheduleRowsHtml = sched.map(s => {
                        const weekStr = String(s.week).padStart(2, '0');
                        if (!s.played) {
                            return `

                                    <td style="text-align:center; font-weight:bold;">${weekStr}</td>
                                    <td></td>

                                    <td></td>

                            `;
                        }
                        const isWin = s.pWins > s.oWins;
                        const rowClass = isWin ? 'sched-row-win' : 'sched-row-loss';
                        const resLetter = isWin ? 'W' : 'L';
                        return `
                            <tr class="${rowClass}">
                                <td style="text-align:center; font-weight:bold;">${weekStr}</td>
                                <td style="text-align:center; font-weight:bold;">${resLetter}</td>

                                <td style="text-align:center;">${s.oWins}</td>
                                <td>${s.opponent}</td>
                            </tr>
                        `;
                    }).join('');

                    // A. Weighted Team Share (TVR) totals & active weight normalization
                    const teamTotals = {
                        directKo: pokemons.reduce((acc, m) => acc + m.directKo, 0),
                        damageDirect: pokemons.reduce((acc, m) => acc + m.damageDirect, 0),
                        battleWon: pokemons.reduce((acc, m) => acc + m.battleWon, 0),
                        survived: pokemons.reduce((acc, m) => acc + m.survived, 0),
                        damageHeal: pokemons.reduce((acc, m) => acc + m.damageHeal, 0),
                        activeTurns: pokemons.reduce((acc, m) => acc + m.activeTurns, 0),
                        indirectKo: pokemons.reduce((acc, m) => acc + m.indirectKo, 0),
                        damageIndirect: pokemons.reduce((acc, m) => acc + m.damageIndirect, 0),
                        timesBrought: pokemons.reduce((acc, m) => acc + m.timesBrought, 0)
                    };

                    const tvrWeights = [
                        { key: 'directKo', weight: 0.15 },
                        { key: 'damageDirect', weight: 0.15 },
                        { key: 'battleWon', weight: 0.15 },
                        { key: 'survived', weight: 0.15 },
                        { key: 'damageHeal', weight: 0.05 },
                        { key: 'activeTurns', weight: 0.10 },
                        { key: 'indirectKo', weight: 0.05 },
                        { key: 'damageIndirect', weight: 0.05 },
                        { key: 'timesBrought', weight: 0.15 }
                    ];

                    const activeWeightSum = tvrWeights.reduce(
                        (sum, item) => sum + (teamTotals[item.key] > 0 ? item.weight : 0),
                        0
                    ) || 1;

                    // B. Per-battle efficiency (BER) raw calculation
                    pokemons.forEach(m => {
                        const games = m.timesBrought || 1;
                        const kosPerGame = (m.directKo + m.indirectKo) / games;
                        const netDmgPerGame = Math.max(
                            0,
                            (m.damageDirect + m.damageIndirect + m.damageHeal - m.damageTaken) / games
                        );
                        const winRate = m.battleWon / games;
                        const survivalRate = m.survived / games;

                        m.rawEfficiency =
                            0.35 * (kosPerGame / 1.5) +
                            0.25 * (netDmgPerGame / 150) +
                            0.25 * winRate +
                            0.15 * survivalRate;
                    });

                    const totalRawEfficiency = pokemons.reduce((acc, m) => acc + m.rawEfficiency, 0) || 1;

                    // C. Finalize TVR, BER, PVR, and Volume / Efficiency O/U ratios
                    pokemons.forEach(m => {
                        let weightedShare = 0;
                        tvrWeights.forEach(item => {
                            if (teamTotals[item.key] > 0) {
                                const w = item.weight / activeWeightSum;
                                weightedShare += w * (m[item.key] / teamTotals[item.key]);
                            }
                        });

                        m.tvr = weightedShare * 100;
                        m.ber = (m.rawEfficiency / totalRawEfficiency) * 100;

                        const cost = getDraftCost(m.species, rawDraftCosts);
                        m.pvr = (cost / totalSeasonBudget) * 100;

                        m.ouVolume = m.pvr > 0 ? m.tvr / m.pvr : 0;
                        m.ouEfficiency = m.pvr > 0 ? m.ber / m.pvr : 0;

        }
        function renderConferenceStats() {
    const container = document.getElementById('conferenceStatsGrid');
    if (!container) return;

    // 1. Group matches & games by conference
    const matchGroups = {};
    rawMatches.forEach(m => {
        if (!matchGroups[m.match_id]) {
            matchGroups[m.match_id] = { info: m, games: [] };
        }
        if (m.game_number) {
            matchGroups[m.match_id].games.push(m);
        }
    });

    const confData = {};
    const playerToConf = {};
    const playerWL = {};

    const ensureConf = (conf) => {
        if (!confData[conf]) {
            confData[conf] = {
                name: conf,
                longestGame: null,
                shortestGame: null,
                players: new Set(),
                mons: {}
            };
        }
        return confData[conf];
    };

    Object.values(matchGroups).forEach(({ info, games }) => {
        if (!info.player_1 || !info.player_2) return;
        const p1 = getDisplayName(info.player_1);
        const p2 = getDisplayName(info.player_2);
        const conf = info.conference ? String(info.conference) : 'Main';
        const cObj = ensureConf(conf);

        playerToConf[p1] = conf;
        playerToConf[p2] = conf;
        cObj.players.add(p1);
        cObj.players.add(p2);

        if (!playerWL[p1]) playerWL[p1] = { w: 0, l: 0 };
        if (!playerWL[p2]) playerWL[p2] = { w: 0, l: 0 };

        games.forEach(g => {
            const w = getDisplayName(g.winner);
            if (w) {
                if (w.toLowerCase() === p1.toLowerCase()) {
                    playerWL[p1].w++;
                    playerWL[p2].l++;

                    playerWL[p2].w++;
                    playerWL[p1].l++;

            if (turns > 0) {

                if (!cObj.longestGame || turns > cObj.longestGame.turns) {
                    cObj.longestGame = { turns, label };
                }
                if (!cObj.shortestGame || turns < cObj.shortestGame.turns) {
                    cObj.shortestGame = { turns, label };
                }
            }
        });
    });

    // 2. Aggregate Pokémon & player stats per conference
    rawStats.forEach(st => {

                };

            playerTotalsMap[m.player].hazardDmg += m.hazardDmg;
            playerTotalsMap[m.player].turns += m.turns;
            playerTotalsMap[m.player].battles = Math.max(playerTotalsMap[m.player].battles, m.brought);

            .sort((a, b) => (b.directKo + b.indirectKo) - (a.directKo + a.indirectKo) || b.totalDmg - a.totalDmg)

                            <thead><tr><th></th><th>Player</th><th>Pokémon</th><th style="text-align:right;">Surv</th><th style="text-align:right;">Hits</th><th style="text-align:right;">Taken</th><th style="text-align:right;">Healed</th></tr></thead>
                            <tbody>
                                ${topDefensive.map((m, i) => `
                                    <tr class="${rankCls(i)}">
                                        <td>${i + 1}</td><td>${m.player}</td><td>${m.species}</td>
                                        <td style="text-align:right;">${m.survived}</td>
                                        <td style="text-align:right;">${m.hitsTaken}</td>
                                        <td style="text-align:right;">${m.takenDmg}</td>
                                        <td style="text-align:right;">${m.healedDmg}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="conf-two-col">
                    <div>
                        <div class="conf-section-title">Most Hazard Damage</div>
                        <table class="conf-mini-table">
                            <thead><tr><th></th><th>Player</th><th>Pokémon</th><th style="text-align:right;">Damage</th><th style="text-align:right;">Team Ratio</th></tr></thead>
                            <tbody>
                                ${topHazardMons.map((m, i) => {
                                    const pTot = (playerTotalsMap[m.player] && playerTotalsMap[m.player].totalDmg) || 1;
                                    const ratio = Math.round((m.totalDmg / pTot) * 100);
                                    return `
                                        <tr class="${rankCls(i)}">
                                            <td>${i + 1}</td><td>${m.player}</td><td>${m.species}</td>
                                            <td style="text-align:right;">${m.hazardDmg}</td>
                                            <td style="text-align:right;">${ratio}%</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div>
                        <div class="conf-section-title">Best Indirect Damaging Pokémon</div>
                        <table class="conf-mini-table">
                            <thead><tr><th></th><th>Player</th><th>Pokémon</th><th style="text-align:right;">KOs</th><th style="text-align:right;">Total</th><th style="text-align:right;">Hazard</th><th style="text-align:right;">Other</th></tr></thead>
                            <tbody>
                                ${topIndirectMons.map((m, i) => `
                                    <tr class="${rankCls(i)}">
                                        <td>${i + 1}</td><td>${m.player}</td><td>${m.species}</td>
                                        <td style="text-align:right;">${m.indirectKo}</td>
                                        <td style="text-align:right;">${m.indirectDmg}</td>
                                        <td style="text-align:right;">${m.hazardDmg}</td>
                                        <td style="text-align:right;">${m.otherIndirectDmg}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="conf-bottom-grid">
                    <div>
                        <div class="conf-section-title">Hazard Damage</div>
                        <table class="conf-mini-table">
                            <thead><tr><th></th><th>Player</th><th style="text-align:right;">Total</th><th style="text-align:right;">Average</th><th style="text-align:center;">W - L</th><th style="text-align:right;">% Total Damage</th></tr></thead>
                            <tbody>
                                ${hazardStandings.map((r, i) => {
                                    const pct = ((r.hazardDmg / confTotalHazard) * 100).toFixed(2);
                                    return `
                                        <tr class="${rankCls(i)}">
                                            <td>${i + 1}</td><td>${r.player}</td>
                                            <td style="text-align:right;">${r.hazardDmg}</td>
                                            <td style="text-align:right;">${r.avgHazard.toFixed(2)}</td>
                                            <td style="text-align:center;">${r.w} - ${r.l}</td>
                                            <td style="text-align:right;">${pct}%</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div>
                            <div class="conf-section-title">Game Turn Totals</div>
                            <table class="conf-mini-table">
                                <thead><tr><th></th><th>Player</th><th style="text-align:right;">Turns</th><th style="text-align:right;">Average</th><th style="text-align:right;">Battles</th></tr></thead>
                                <tbody>
                                    ${turnStandings.map((r, i) => `
                                        <tr class="${rankCls(i)}">
                                            <td>${i + 1}</td><td>${r.player}</td>
                                            <td style="text-align:right;">${r.turns}</td>
                                            <td style="text-align:right;">${Math.round(r.avgTurns)}</td>
                                            <td style="text-align:right;">${r.battles}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <table class="conf-mini-table">
                            <thead><tr><th colspan="2" style="text-align:left;">Highest Average Turns</th><th style="text-align:right;">Average</th></tr></thead>
                            <tbody>
                                <tr><td>${highestAvgTurn ? highestAvgTurn.player : '-'}</td><td>${highestAvgTurn ? highestAvgTurn.turns : 0}</td><td style="text-align:right;">${highestAvgTurn ? Math.round(highestAvgTurn.avgTurns) : 0}</td></tr>
                            </tbody>
                        </table>

                        <table class="conf-mini-table">
                            <thead><tr><th colspan="2" style="text-align:left;">Lowest Average Turns</th><th style="text-align:right;">Average</th></tr></thead>
                            <tbody>
                                <tr><td>${lowestAvgTurn ? lowestAvgTurn.player : '-'}</td><td>${lowestAvgTurn ? lowestAvgTurn.turns : 0}</td><td style="text-align:right;">${lowestAvgTurn ? Math.round(lowestAvgTurn.avgTurns) : 0}</td></tr>
                            </tbody>
                        </table>

                        <table class="conf-mini-table">
                            <thead><tr><th>Most Brought Pokémon</th><th style="text-align:right;">Brought</th><th style="text-align:right;">1 time</th></tr></thead>
                            <tbody>
                                <tr><td>${mostBrought ? `${mostBrought.player} (${mostBrought.species})` : '-'}</td><td style="text-align:right;">${mostBrought ? mostBrought.brought : 0}</td><td style="text-align:right;">${oneTimeCount}</td></tr>
                            </tbody>
                        </table>

                        <table class="conf-mini-table">
                            <thead><tr><th>Least Brought Pokémon</th><th style="text-align:right;">Brought</th><th style="text-align:right;">1 time</th></tr></thead>
                            <tbody>
                                <tr><td>${leastBrought ? `${leastBrought.player} (${leastBrought.species})` : '-'}</td><td style="text-align:right;">${leastBrought ? leastBrought.brought : 0}</td><td style="text-align:right;">${oneTimeCount}</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}
        function switchTab(tabId) {
            document.querySelectorAll('.header-tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
