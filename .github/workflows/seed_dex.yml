name: Seed Pokemon Dex Table

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @libsql/client
        run: npm install @libsql/client

      - name: Create and Run Seed Script
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node -e '
          import("@libsql/client").then(async ({ createClient }) => {
            const db = createClient({
              url: process.env.TURSO_DATABASE_URL,
              authToken: process.env.TURSO_AUTH_TOKEN,
            });

            console.log("Re-creating pokemon_dex table with proper constraints...");
            await db.execute(`
              CREATE TABLE IF NOT EXISTS pokemon_dex (
                  pokemon_name TEXT PRIMARY KEY,
                  dex_id INTEGER NOT NULL
              );
            `);

            console.log("Fetching standard Pokémon from PokeAPI...");
            const res = await fetch("https://pokeapi.co/api/v2/pokemon?limit=1025");
            const data = await res.json();

            const statements = [];
            for (const item of data.results) {
              const match = item.url.match(/\/pokemon\/(\d+)\//);
              if (!match) continue;
              statements.push({
                sql: "INSERT OR REPLACE INTO pokemon_dex (pokemon_name, dex_id) VALUES (?, ?)",
                args: [item.name, Number(match[1])]
              });
            }

            console.log("Fetching special forms/variants (Gen 6-9 forms, Therians, Megas)...");
            // PokeAPI lists form variants starting from ID 10001 onwards
            for (let id = 10001; id <= 10400; id++) {
              try {
                const formRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                if (formRes.ok) {
                  const formData = await formRes.json();
                  statements.push({
                    sql: "INSERT OR REPLACE INTO pokemon_dex (pokemon_name, dex_id) VALUES (?, ?)",
                    args: [formData.name, id]
                  });
                }
              } catch (e) {
                // Ignore missing form IDs
              }
            }

            // Manual mapping fallbacks for backend name matching (e.g. "landorus" -> Incarnate form ID 645)
            const manualAliases = [
              { name: "landorus", id: 645 },
              { name: "landorus-therian", id: 10021 },
              { name: "thundurus", id: 642 },
              { name: "thundurus-therian", id: 10020 },
              { name: "tornadus", id: 641 },
              { name: "tornadus-therian", id: 10019 },
              { name: "charizard-mega-x", id: 10034 },
              { name: "charizard-mega-y", id: 10035 }
            ];

            for (const m of manualAliases) {
              statements.push({
                sql: "INSERT OR REPLACE INTO pokemon_dex (pokemon_name, dex_id) VALUES (?, ?)",
                args: [m.name, m.id]
              });
            }

            console.log(`Executing batch insertion of ${statements.length} entries into Turso...`);
            // Execute in chunks of 200 to avoid pipeline limits
            for (let i = 0; i < statements.length; i += 200) {
              await db.batch(statements.slice(i, i + 200));
            }

            console.log("✅ Successfully populated pokemon_dex with all forms and variants!");
          });
          '
